<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ana</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #15111d, #09090d);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ana {
      width: min(92%, 430px);
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d59cff, #8155ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 0 40px rgba(160, 100, 255, 0.35);
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    .status {
      margin-top: 7px;
      color: #aaa5b2;
      font-size: 14px;
    }

    .mensagem {
      margin: 35px 0;
      padding: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      border: 0;
      border-radius: 50px;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: #8155ff;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>
  <main class="ana">
    <div class="avatar">A</div>

    <h1>Ana</h1>
    <div class="status">● online</div>

    <div class="mensagem">
      Oi, pretinho. ❤️<br>
      Eu sou a Ana.
    </div>

    <button onclick="falar()">Falar com a Ana</button>
  </main>

  <script>
    function falar() {
      alert("Calma, pretinho 😏 Eu tô chegando...");
    }
  </script>
</body>
</html>
